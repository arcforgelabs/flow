<!-- @dsCard group="Feedback" height=110 -->
<div class="fds-row" id="root"></div>
<script>
const { h, pickOne, toast } = window.FlowDesignSystem;
const clients = [
  { id: 'x1', name: 'Harbour Dental Surgery', email: 'accounts@harbour.example' },
  { id: 'x2', name: 'Harbour Dental Group', email: 'billing@harbourgroup.example' },
  { id: 'x3', name: 'Bright Smiles', email: 'hello@bright.example' },
];
document.getElementById('root').append(h('button', { class: 'fx-btn fx-btn--primary', type: 'button', onclick: async () => {
  const picked = await pickOne({
    title: 'Link Harbour Dental to Xero', intro: 'Pick the Xero client. Flow links the two. Xero does not change.',
    label: 'Xero clients', find: 'Find a Xero client', load: async () => clients,
    item: (row) => ({ value: row.id, title: row.name, meta: row.email }), empty: 'No Xero client has that name.', confirm: 'Link',
  });
  toast(picked ? `Linked to ${picked.name}.` : 'Not linked.', picked ? 'success' : 'info');
} }, 'Link'));
</script>
