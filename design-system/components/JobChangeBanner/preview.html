<div id="root"></div>
<script>
const { jobChangeBanner, ui, toast } = window.FlowDesignSystem;
const money = (c) => `$${(c / 100).toFixed(2)}`;
const change = {
  systemName: 'Seazona', sourceInvoiceRef: '10423', canAccept: true, canAdopt: true,
  lines: [{ position: 2, change: 'changed', fields: ['quantity'], was: { code: 'ZC', description: 'Zirconia crown', quantity: 1, unitAmountCents: 32000 }, now: { code: 'ZC', description: 'Zirconia crown', quantity: 2, unitAmountCents: 32000 } }],
  total: { was: 48000, now: 80000 },
};
document.getElementById('root').append(jobChangeBanner(ui(), change, { money, onAccept: () => toast('Change accepted.', 'success'), onRecheck: async () => {} }));
</script>
