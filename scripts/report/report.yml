# Customer report template: written by hand once, filled by the
# customer-report workflow each week (docs/CUSTOMER_REPORT.md).
# Every value below comes from public GitHub records: releases, pull requests,
# labels and issues. Nothing here reads customer data, Sentry or support tickets.
product: Flow
title: Flow week in review
kind: Week in review           # the name beside the product; the period can run a few days past the week
timezone: Australia/Sydney

# Pull request labels that steer the report.
labels:
  major: "report: major"       # a big change to the customer's daily work
  support: "report: support"   # came from a support request
  hide: "report: hide"         # internal: leave it out
  security: "impact:security"
  roadmap: "roadmap"           # open issues with this label show as In progress

highlights: 6                  # Major first, then support, then newest

stats:
  - { id: updates, icon: rocket, label: Updates, go: d-updates, count: items }
  - { id: security, icon: shield-check, label: Security, go: d-security, count: security }
  - { id: support, icon: life-buoy, label: Support, go: d-support, count: support, note: resolved }

# Stage of an in-progress item, from its open pull request. No dates.
stages:
  none: [Plan, 0]
  draft: [Build, 25]
  ready: [Review, 50]
  approved: [Test, 75]

planned: Planned releases

# Ongoing work, one pizza slice each. {security}, {support} and {fix} come
# from the period's records ({fix} = average time from request to fix).
# `zero` replaces the result when its count is 0; `nodata` when its source is not set up.
# {errors} and {errorsFixed} are new error groups in the period and how many are resolved
# (Sentry, counts only; needs SENTRY_AUTH_TOKEN in the workflow).
ongoing:
  - { icon: shield-check, name: Security, result: "{security} updates", zero: All clear, does: Checks Flow's software for known flaws., when: Every week }
  - { icon: life-buoy, name: Error watch, result: "{errors} caught", zero: None caught, nodata: Watching, does: "{errorsFixed} of {errors} resolved.", when: All the time }
  - { icon: message-square, name: Requests, result: "{support} resolved", does: "Request to fix: {fix} on average.", when: Every request }

