# Weekly update pull requests. Minor and patch updates arrive grouped in one
# pull request per ecosystem; each major update arrives on its own.
# Titles start with "chore:", the typed title CONTRIBUTING.md asks for.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Adelaide
    commit-message:
      prefix: chore
    open-pull-requests-limit: 3
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Adelaide
    commit-message:
      prefix: chore
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
