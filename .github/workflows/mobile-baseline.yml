name: Mobile Baseline

# Makes the phone suite's saved images and budget (docs/MOBILE_TESTS.md) on a
# pull request's branch and commits them there, in the same Playwright image
# the Mobile workflow uses. A person reviews the images in the pull request.
# `budget: lower` only lowers numbers (after a fix); `budget: start` writes
# the budget from this run (the first time, or when screens are added). It
# never runs on main.

on:
  workflow_dispatch:
    inputs:
      budget:
        description: How to write test/mobile/budget.json
        type: choice
        options: [lower, start]
        default: lower

permissions:
  contents: read

concurrency:
  group: flow-mobile-baseline-${{ github.ref }}

jobs:
  baseline:
    name: baseline
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow_mobile
        options: >-
          --health-cmd "pg_isready -U flow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database inside this job; not a secret.
      FLOW_TEST_DATABASE_URL: postgres://flow:flow@postgres:5432/flow_mobile
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Measure and save every screen
        env:
          MOBILE_RECORD: '1'
        run: npm run test:mobile -- --update-snapshots=all --workers=4 --retries=0

      - name: Write the budget
        env:
          BUDGET: ${{ inputs.budget }}
        run: npm run test:mobile:budget -- $([ "$BUDGET" = lower ] && echo --lower)

      - name: Commit to the branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/mobile/__screenshots__ test/mobile/budget.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "test(mobile): saved images and budget from Mobile Baseline"
          git push origin "HEAD:refs/heads/${BRANCH}"
