name: CI

# The `test` job is the gate the main ruleset (.github/rulesets/main.json)
# requires by name, so keep that name.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database inside this job; not a secret.
      FLOW_TEST_DATABASE_URL: postgres://flow:flow@localhost:5432/flow_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
