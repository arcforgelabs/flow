# Area labels for pull requests, applied by .github/workflows/labeler.yml
# (actions/labeler v7 syntax). The workflow reads this file from the base
# branch only, so a pull request cannot change how it is itself labelled.
"area: invoices":
  - changed-files:
      - any-glob-to-any-file:
          - server/core/invoices.js
          - server/core/money.js
          - server/api/invoicing.js
          - server/ui/invoicing.js
          - test/invoices.test.js
          - test/invoicing-api.test.js
          - test/money.test.js

